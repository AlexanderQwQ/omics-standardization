# =============================================================================
# omics_standardization -- Conda environment specification
# =============================================================================
# Usage:
#   cd /d d:\Database\omics_standardization
#   conda env create -f environment.yml
#   conda activate omics-std
#   pip install -e ".[test,dev]"
#
# Includes: Python + PyTorch + R/Bioconductor + kallisto + all parsers
# Excludes: dmPython (DM8 driver, Windows-only, manual install)
# =============================================================================

name: omics-std
channels:
  - conda-forge
  - bioconda
  - pytorch
  - defaults

dependencies:
  # ---- Python runtime ----
  - python>=3.10,<3.14
  - pip
  - setuptools>=65

  # ---- Core dependencies (conda-forge) ----
  - anndata>=0.10
  - scanpy>=1.9
  - numpy>=1.21
  - pandas>=1.5
  - scipy>=1.9
  - scikit-learn>=1.1
  - matplotlib>=3.7
  - seaborn>=0.12
  - pyyaml>=6.0
  - tqdm
  - h5py>=3.8
  - joblib
  - numba>=0.57
  - pydantic>=2.0
  - rich

  # ---- PyTorch (pytorch channel, CUDA by default) ----
  - pytorch::pytorch>=1.13

  # ---- R + Bioconductor (runtime for rpy2, TMM/DESeq2/VSN/Scran) ----
  - r-base>=4.0
  - rpy2>=3.5
  - bioconductor-edger
  - bioconductor-deseq2
  - bioconductor-limma
  - bioconductor-scran

  # ---- Bioinformatics tools (bioconda) ----
  - pysam>=0.22
  - kallisto
  - biom-format>=2.1

  # ---- Dev & test ----
  - pytest>=7.0
  - pytest-cov
  - pytest-mock
  - ruff
  - pre-commit

  # ---- Docs ----
  - sphinx>=6.0
  - myst-nb>=1.0
  - sphinx-book-theme>=1.0
  - nbsphinx
  - ipykernel

  # ---- pip-only packages (not available or outdated on conda-forge) ----
  - pip:
    - muon>=0.1
    - mudata>=0.2
    - scvi-tools>=1.0
    - fcsparser>=0.2
    - pymzml>=2.5
    - magic-impute>=3.0
    - minio>=7.2
    - neo4j>=5.20
    # - dmPython>=8.0  # uncomment after installing DM8 client
