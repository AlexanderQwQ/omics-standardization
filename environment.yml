# =============================================================================
# omics_standardization -- Conda environment specification (Windows compatible)
# =============================================================================
# Usage:
#   # Step 1: 手动安装 R + Bioconductor + kallisto（见下方说明）
#   # Step 2:
#   cd /d d:\Database\omics_standardization
#   conda env create -f environment.yml
#   conda activate omics-std
#   pip install -e ".[test,dev]"
#
# Includes: Python + PyTorch + rpy2 + all Python parsers
# Excludes from conda (manual install required):
#   - Bioconductor packages (edgeR, DESeq2, limma, scran) -> install in R manually
#   - kallisto -> download Windows binary and add to PATH
#   - dmPython (DM8 driver, Windows-only, optional)
#
# ==== Windows 手动安装步骤 ====
#
# 1. 安装 R for Windows:
#    下载: https://cran.r-project.org/bin/windows/base/
#    安装到默认路径 (C:\Program Files\R\R-4.x.x)
#
# 2. 安装 Bioconductor 包（以管理员身份打开 R 或 RStudio）:
#    if (!require("BiocManager", quietly = TRUE)) install.packages("BiocManager")
#    BiocManager::install(c("edgeR", "DESeq2", "limma", "scran", "SingleCellExperiment"))
#
# 3. 安装 kallisto:
#    下载: https://pachterlab.github.io/kallisto/download
#    解压后将 kallisto.exe 所在目录添加到系统 PATH
#    验证: 新开终端执行 kallisto version
#
# 4. （可选）安装 DM8 客户端 → 取消 environment.yml 中 dmPython 的注释
# =============================================================================

name: omics-std
channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  # ---- Python runtime ----
  - python>=3.10,<3.14
  - pip
  - setuptools>=65

  # ---- Core dependencies (conda-forge) ----
  - anndata>=0.10
  - scanpy>=1.9
  - numpy>=1.21
  - pandas>=1.5
  - scipy>=1.9
  - scikit-learn>=1.1
  - matplotlib>=3.7
  - seaborn>=0.12
  - pyyaml>=6.0
  - tqdm
  - h5py>=3.8
  - joblib
  - numba>=0.57
  - pydantic>=2.0
  - rich

  # ---- PyTorch (pytorch channel, CUDA by default) ----
  - pytorch::pytorch>=1.13

  # ---- R + rpy2 bridge (rpy2 needs system R, see manual steps above) ----
  # conda-forge r-base works on Windows, but Bioconductor packages don't
  # -> R/Bioconductor must be installed manually (see header)
  - r-base>=4.0
  - rpy2>=3.5

  # ---- pysam (BAM/SAM support) is NOT in conda on Windows ----
  # Only needed for .bam/.sam files. Install manually if required:
  #   pip install pysam  (needs Visual Studio Build Tools + Cython)

  # ---- Dev & test ----
  - pytest>=7.0
  - pytest-cov
  - pytest-mock
  - ruff
  - pre-commit

  # ---- Docs ----
  - sphinx>=6.0
  - myst-nb>=1.0
  - sphinx-book-theme>=1.0
  - nbsphinx
  - ipykernel

  # ---- pip-only packages (not available or outdated on conda-forge) ----
  - pip:
    - muon>=0.1
    - mudata>=0.2
    - scvi-tools>=1.0
    - fcsparser>=0.2
    - pymzml>=2.5
    - magic-impute>=3.0
    - minio>=7.2
    - neo4j>=5.20
    - biom-format>=2.1
    # - dmPython>=8.0  # uncomment after installing DM8 client
